<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <link rel="stylesheet" href="chamber.css">

    <script src="chamber.js" defer></script>
</head>

<body>
    <main>
        <section class="weather-card">
            <h3>Current Weather</h3>
            <p>Temperature: <strong><span id="current-temp"></span></strong></p>
            <figure>
                <img id="weather-icon" src="" alt="">
                <figcaption></figcaption>
            </figure>

            <h3>3-Day Forecast</h3>
            <div id="forecast-container"></div>
        </section>
        <section class="spotlights-section">
            <h3>Member Spotlights</h3>
            <div id="spotlight-container" class="spotlight-grid"></div>
        </section>
    </main>
    <footer>
        Kgotla Ephraim Boabilwe | WDD 231
    </footer>
</body>

</html>
